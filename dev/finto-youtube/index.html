<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8" />
<title>YouTube</title>
<style>
  body { margin: 0; font-family: Roboto, Arial, sans-serif; background: #0f0f0f; color: #f1f1f1; }
  header { display: flex; align-items: center; gap: 24px; height: 56px; padding: 0 16px; }
  .logo { display: flex; align-items: center; gap: 6px; font-weight: 700; font-size: 20px; cursor: pointer; }
  .logo b { background: #ff0033; color: #fff; border-radius: 6px; padding: 0 7px; font-size: 13px; }
  .search { flex: 1; max-width: 560px; margin: 0 auto; display: flex; }
  .search input { flex: 1; background: #121212; border: 1px solid #303030; border-radius: 40px 0 0 40px; color: #fff; padding: 8px 16px; font-size: 16px; }
  .search button { width: 64px; background: #222; border: 1px solid #303030; border-radius: 0 40px 40px 0; color: #fff; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; padding: 16px 24px; }
  .card { cursor: pointer; }
  .thumb { aspect-ratio: 16/9; border-radius: 12px; display: flex; align-items: flex-end; justify-content: flex-end; padding: 8px; box-sizing: border-box; font-size: 12px; }
  .thumb span { background: rgb(0 0 0 / .8); padding: 2px 4px; border-radius: 4px; }
  .card h3 { margin: 10px 0 4px; font-size: 16px; }
  .card p { margin: 0; color: #aaa; font-size: 14px; }
  .watch { display: grid; grid-template-columns: 1fr 360px; gap: 24px; padding: 16px 24px; }
  #movie_player { position: relative; background: #000; border-radius: 12px; overflow: hidden; aspect-ratio: 16/9; }
  #movie_player video { width: 100%; height: 100%; display: block; }
  .ad-badge { display: none; position: absolute; left: 12px; bottom: 56px; background: #ffcc00; color: #000; font-weight: 700; padding: 4px 8px; border-radius: 4px; }
  #movie_player.ad-showing .ad-badge { display: block; }
  ytd-watch-metadata h1 { font-size: 20px; margin: 12px 0; }
  .side .card { display: grid; grid-template-columns: 168px 1fr; gap: 8px; margin-bottom: 8px; }
  .side h3 { font-size: 14px; margin: 0; }
</style>
</head>
<body>
<header>
  <div class="logo" id="logo"><b>▶</b> YouTube <small style="color:#aaa;font-weight:400">(prova)</small></div>
  <form class="search" id="search"><input placeholder="Cerca" value="karaoke" /><button>🔍</button></form>
</header>
<main id="app"></main>
<script>
const VIDEOS = [
  { id: 'volare01', title: 'Volare (Nel blu dipinto di blu) – Karaoke con testo', ch: 'Karaoke Italia', dur: '0:40', color: '#3b82f6' },
  { id: 'azzurro2', title: 'Azzurro – Base karaoke', ch: 'Basi Musicali', dur: '0:40', color: '#10b981' },
  { id: 'pubblic3', title: 'Una lunga storia d\'amore – Karaoke (con pubblicità)', ch: 'Karaoke Italia', dur: '0:40', color: '#f59e0b', ad: true },
  { id: 'felicit4', title: 'Felicità – Karaoke', ch: 'Basi Musicali', dur: '0:40', color: '#ef4444' },
  { id: 'cantare5', title: 'L\'italiano (Lasciatemi cantare) – Karaoke', ch: 'Karaoke Italia', dur: '0:40', color: '#8b5cf6' },
  { id: 'emozion6', title: 'Emozioni – Base con testo', ch: 'Basi Musicali', dur: '0:40', color: '#ec4899' }
]
const app = document.getElementById('app')
const card = (v) => `<div class="card" data-id="${v.id}"><div class="thumb" style="background:${v.color}"><span>${v.dur}</span></div><div><h3>${v.title}</h3><p>${v.ch}</p></div></div>`

function navigate(url) {
  history.pushState({}, '', url)
  render()
}

function render() {
  const url = new URL(location.href)
  if (url.pathname === '/watch') {
    const v = VIDEOS.find((x) => x.id === url.searchParams.get('v')) || VIDEOS[0]
    app.innerHTML = `<div class="watch"><div>
        <div id="movie_player" class="html5-video-player"><video class="html5-main-video" src="/prova.webm" controls></video><div class="ad-badge">Annuncio · 0:05</div></div>
        <ytd-watch-metadata><h1><yt-formatted-string></yt-formatted-string></h1></ytd-watch-metadata>
        <p style="color:#aaa">${v.ch}</p></div>
        <div class="side">${VIDEOS.filter((x) => x.id !== v.id).map(card).join('')}</div></div>`
    // Come su YouTube, il titolo arriva un attimo dopo
    setTimeout(() => {
      document.querySelector('ytd-watch-metadata yt-formatted-string').textContent = v.title
      document.title = v.title + ' - YouTube'
    }, 300)
    const player = document.getElementById('movie_player')
    const video = player.querySelector('video')
    if (v.ad) {
      // Pubblicità finta: 5 secondi con la classe .ad-showing, poi il contenuto da capo
      player.classList.add('ad-showing')
      setTimeout(() => {
        player.classList.remove('ad-showing')
        video.currentTime = 0
        video.play()
      }, 5000)
    }
    video.play().catch(() => {})
  } else {
    document.title = 'YouTube'
    app.innerHTML = `<div class="grid">${VIDEOS.map(card).join('')}</div>`
  }
  window.dispatchEvent(new Event('yt-navigate-finish'))
}

document.addEventListener('click', (e) => {
  const c = e.target.closest('.card')
  if (c) navigate('/watch?v=' + c.dataset.id)
  if (e.target.closest('#logo')) navigate('/')
})
document.getElementById('search').addEventListener('submit', (e) => { e.preventDefault(); navigate('/') })
window.addEventListener('popstate', render)
render()
</script>
</body>
</html>
